name: Deploy AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-python-api
  CONTAINER_NAME: devops-python-api
  APP_PORT: "8000"

jobs:
  test:
    name: Testes
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verificar análise estática
        run: ruff check .

      - name: Executar testes
        run: pytest --cov=app --cov-report=term-missing

  build-and-push:
    name: Build e publicação no ECR
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Obter o código
        uses: actions/checkout@v6

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir e publicar a imagem
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    name: Deploy na EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar o contêiner na EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          APP_PORT: ${{ env.APP_PORT }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,ECR_REPOSITORY,CONTAINER_NAME,APP_PORT,IMAGE_TAG
          script_stop: true
          script: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            docker pull "$IMAGE"
            docker rm --force "$CONTAINER_NAME" || true
            docker run --detach \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --publish "${APP_PORT}:8000" \
              "$IMAGE"

            for attempt in $(seq 1 15); do
              if curl --fail --silent "http://127.0.0.1:${APP_PORT}/health"; then
                echo
                docker ps --filter "name=${CONTAINER_NAME}"
                exit 0
              fi
              echo "Tentativa ${attempt}: API ainda não está pronta"
              sleep 2
            done

            docker logs "$CONTAINER_NAME"
            exit 1
